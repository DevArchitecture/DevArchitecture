name: devarchitecture

services:
  db:
    image: postgres:17-alpine
    # Loopback only: reach it through an SSH tunnel, never from the internet.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devarchitecture}
      POSTGRES_USER: ${POSTGRES_USER:-devarch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?create deploy/oracle/.env from .env.example}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Loopback only: reach it through an SSH tunnel, never from the internet.
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: WebAPI/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AppSettings__Mode: Production
      Database__AutoMigrate: "true"
      TokenOptions__SecurityKey: ${TOKEN_OPTIONS_SECURITY_KEY:?create deploy/oracle/.env from .env.example}
      ConnectionStrings__DArchPgContext: Host=db;Port=5432;Database=${POSTGRES_DB:-devarchitecture};Username=${POSTGRES_USER:-devarch};Password=${POSTGRES_PASSWORD}
      CacheOptions__Host: redis
      CacheOptions__Port: "6379"
      CacheOptions__Database: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/oracle/web/Dockerfile
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db:
  caddy_data:
  caddy_config:
